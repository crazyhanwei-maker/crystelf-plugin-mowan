<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>魔丸控制台 - 任务中心</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/task-center.css" />
</head>
<body class="task-center-page auth-guarded-page">
  <div class="page auth-guarded-content">
    <header class="hero">
      <div class="hero-copy">
        <div class="hero-badge">调度总览</div>
        <h1>任务中心</h1>
        <p id="task-center-meta">正在读取插件内定时任务状态...</p>
      </div>
      <div class="hero-actions-shell">
        <div class="hero-action-group">
          <div class="hero-action-label">任务操作</div>
          <div class="actions hero-actions-grid">
            <button id="task-center-refresh-btn" type="button">刷新</button>
            <a class="link-btn" href="/index.html">返回总览</a>
          </div>
        </div>
      </div>
    </header>

    <section class="panel">
      <div class="section-head">
        <div>
          <h2>自定义任务</h2>
          <div class="setting-help">灵晶按计划自动执行：发送消息、内置命令、命令行或 Agent 任务。到点未在线的消息会自动排队重试；进程重启后错过的执行不补跑。</div>
        </div>
        <div class="actions">
          <button id="custom-task-add-btn" type="button">新建任务</button>
        </div>
      </div>
      <div id="custom-task-editor" class="custom-task-editor hidden">
        <div class="custom-task-form-row">
          <label class="custom-task-field custom-task-field-name">名称
            <input id="custom-task-name" maxlength="40" placeholder="例如：每晚群提醒" />
          </label>
          <label class="custom-task-field">动作类型
            <select id="custom-task-action-type">
              <option value="message">发送消息</option>
              <option value="command">执行内置命令</option>
              <option value="shell">执行命令行</option>
              <option value="agent">Agent 任务</option>
            </select>
          </label>
          <label class="custom-task-field">调度
            <select id="custom-task-schedule-type">
              <option value="daily">每天</option>
              <option value="weekly">每周</option>
              <option value="interval">每 N 分钟</option>
            </select>
          </label>
        </div>
        <div id="custom-task-action-fields" class="custom-task-fields"></div>
        <div id="custom-task-schedule-fields" class="custom-task-fields"></div>
        <div class="custom-task-form-actions">
          <label class="custom-task-enabled-label">
            <input id="custom-task-enabled" type="checkbox" checked />
            <span>启用</span>
          </label>
          <button id="custom-task-save-btn" type="button">保存任务</button>
          <button id="custom-task-cancel-btn" type="button" class="link-btn">取消</button>
        </div>
      </div>
      <div id="custom-task-list" class="custom-task-list">
        <div class="task-center-empty">正在加载自定义任务...</div>
      </div>
    </section>

    <section class="panel">
      <div class="section-head">
        <div>
          <h2>定时任务</h2>
          <div class="setting-help">汇总插件内所有后台定时活动：调度规则、下次运行时间与最近执行结果。手动运行只触发当次，不改动原调度。</div>
        </div>
      </div>
      <div id="task-center-list" class="task-center-list">
        <div class="task-center-empty">正在加载任务状态...</div>
      </div>
    </section>

    <section class="panel">
      <div class="section-head">
        <div>
          <h2>体检报告</h2>
          <div class="setting-help">聚合启动自检、接口健康与依赖检查，一键生成可分享的纯文本报告，转发给维护者即可协助排查。</div>
        </div>
        <div class="actions">
          <button id="health-report-generate-btn" type="button">生成报告</button>
          <button id="health-report-copy-btn" type="button" disabled>复制报告</button>
        </div>
      </div>
      <pre id="health-report-box" class="detail-box task-center-report-box">点击"生成报告"查看体检结果。</pre>
    </section>
  </div>

  <script src="/auth.js"></script>
  <script src="/console-shell.js"></script>
  <script src="/task-center.js"></script>
  <script src="/theme.js"></script>
</body>
</html>
