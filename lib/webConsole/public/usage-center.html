<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>魔丸控制台 - AI 用量日志中心</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%233a6df0'/%3E%3Cpath d='M18 18h28v8H30v8h14v8H30v14H18Z' fill='white'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="page">
    <header class="hero">
      <div class="hero-copy">
        <div class="hero-badge">魔丸控制台</div>
        <h1>AI 用量日志中心</h1>
        <p id="page-meta">正在读取今日 AI 用量数据...</p>
      </div>
      <div class="hero-actions-shell">
        <div class="hero-action-group hero-token-group">
          <div class="hero-action-label">访问凭证</div>
          <div class="hero-token-row">
            <input id="auth-token" placeholder="控制台访问令牌，可留空" />
            <button id="save-token-btn">保存令牌</button>
          </div>
        </div>
        <div class="hero-action-group">
          <div class="hero-action-label">页面操作</div>
          <div class="actions hero-actions-grid">
            <button id="refresh-btn">刷新数据</button>
            <button id="clear-filters-btn">清空筛选</button>
            <a class="link-btn" href="/index.html">返回首页</a>
            <button id="theme-toggle-btn" data-theme-toggle>深色主题</button>
          </div>
        </div>
      </div>
    </header>

    <section class="panel panel-two">
      <div>
        <h2>页面状态</h2>
        <div id="refresh-status" class="setting-help">正在准备数据...</div>
      </div>
      <div>
        <h2>今日概览</h2>
        <pre id="daily-usage-box" class="detail-box">加载中...</pre>
      </div>
    </section>

    <section class="panel">
      <div class="section-head">
        <div>
          <h2>关键指标</h2>
          <div class="setting-help">这里汇总今天的请求量、错误量、Token 与图片相关场景消耗，便于快速判断是否异常。</div>
        </div>
      </div>
      <div id="usage-summary" class="config-summary">加载中...</div>
    </section>

    <section class="panel panel-two">
      <div>
        <h2>场景分布</h2>
        <pre id="scene-summary-box" class="detail-box">加载中...</pre>
      </div>
      <div>
        <h2>最近 24 小时趋势</h2>
        <div id="trend-chart" class="chart-box">加载中...</div>
      </div>
    </section>

    <section class="panel">
      <div class="section-head">
        <div>
          <h2>AI 用量日志</h2>
          <div class="setting-help">支持按场景筛选与全文搜索，详情页可继续查看单条请求的 Prompt、响应、耗时和 Token 明细。</div>
        </div>
        <div class="actions">
          <button id="export-usage-logs-btn" class="mini-btn">导出日志</button>
        </div>
      </div>
      <div class="toolbar">
        <input id="usage-log-search" placeholder="搜索模型 / 场景 / 群号 / 用户 / 预览文本" />
        <input id="usage-log-scene" placeholder="按场景筛选，例如 chat / poke_image_summary" />
      </div>
      <div class="toolbar">
        <span class="setting-help">快捷筛选</span>
        <button class="mini-btn active" data-usage-scene="">全部场景</button>
        <button class="mini-btn" data-usage-scene="chat">普通对话</button>
        <button class="mini-btn" data-usage-scene="image_monitor_review">图片监控审核</button>
        <button class="mini-btn" data-usage-scene="poke_image_summary">戳一戳图片摘要</button>
      </div>
      <div id="usage-log-box" class="list log-list">加载中...</div>
      <div id="usage-log-pagination" class="pagination"></div>
    </section>
  </div>

  <script src="/usage-center.js"></script>
  <script src="/theme.js"></script>
</body>
</html>
