<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>魔丸控制台 - 插件设置中心</title>
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/plugin-settings.css" />
</head>
<body class="plugin-settings-page">
  <div class="page">
    <header class="hero">
      <div>
        <div class="hero-badge">魔丸控制台</div>
        <h1>灵晶设置</h1>
        <p id="plugin-settings-meta">分类/分组导航已移至左侧「灵晶设置」菜单；这里集中修改当前分组的配置。</p>
      </div>
      <div class="actions">
        <button id="plugin-settings-save-btn">保存插件设置</button>
        <a class="link-btn" href="/">返回首页</a>
      </div>
    </header>

    <div id="plugin-settings-shell" class="plugin-settings-shell">
      <aside id="plugin-settings-drawer" class="panel plugin-settings-drawer" style="display: none;">
        <div class="plugin-settings-sidebar-head">
          <h2>设置导航</h2>
          <div class="setting-status">从左侧选择分类，右侧会显示对应设置。</div>
        </div>
        <div class="plugin-settings-sidebar-card">
          <div class="kv-label">当前分组</div>
          <div id="plugin-settings-summary" class="kv-value">正在加载设置项...</div>
        </div>
        <div class="plugin-settings-side-section">
          <div class="kv-label">导航搜索</div>
          <div class="plugin-settings-search-row">
            <input id="plugin-settings-search" placeholder="搜索设置名称、分类或说明" />
            <button id="plugin-settings-search-clear-btn">清空</button>
          </div>
          <div id="plugin-settings-search-status" class="setting-status">可按设置名称、分类或说明快速定位。</div>
        </div>
        <div id="plugin-settings-config-nav" class="plugin-settings-side-section">
          <div class="kv-label">分类</div>
          <div id="plugin-settings-category-tabs" class="plugin-settings-side-nav"></div>
          <div class="kv-label">分组</div>
          <div id="plugin-settings-group-tabs" class="plugin-settings-group-nav"></div>
        </div>
      </aside>

      <div class="plugin-settings-main">
        <div class="plugin-settings-top-tabs">
          <button class="plugin-settings-side-btn active" data-plugin-top-tab="plugin-settings-config-panel">灵晶设置</button>
          <button class="plugin-settings-side-btn" data-plugin-top-tab="plugin-settings-features-panel">功能状态</button>
          <button class="plugin-settings-side-btn" data-plugin-top-tab="plugin-settings-skills-panel">Skills 设置</button>
        </div>
        <div id="plugin-settings-risk" class="risk-box hidden"></div>

        <section id="plugin-settings-config-panel" class="panel">
          <div class="plugin-settings-content-head">
            <h2 id="plugin-settings-group-title">配置项</h2>
            <div id="plugin-settings-group-desc" class="setting-status">在这里修改当前分组的配置。</div>
            <div id="plugin-settings-config-meta" class="plugin-settings-panel-meta"></div>
          </div>
          <div id="plugin-settings-form" class="plugin-settings-form-grid">加载中...</div>

          <section id="plugin-settings-private-safety-panel" class="plugin-settings-special-panel hidden">
            <div class="plugin-settings-special-panel-head">
              <div>
                <h3>私聊安全管理</h3>
                <div class="setting-status">查看私聊安全黑名单、警告记录和 LLM 复审缓存状态；这里不会展示用户私聊原文。</div>
              </div>
            </div>
            <div id="plugin-settings-private-safety-meta" class="plugin-settings-panel-meta"></div>
            <div id="plugin-settings-private-safety-box" class="settings-grid">加载中...</div>
          </section>
        </section>

        <section id="plugin-settings-features-panel" class="panel hidden">
          <div class="plugin-settings-content-head">
            <h2>功能状态</h2>
            <div class="setting-status">查看主要功能是否开启，以及控制台当前运行状态。</div>
            <div id="plugin-settings-features-meta" class="plugin-settings-panel-meta"></div>
          </div>
          <div id="plugin-settings-feature-list" class="tag-list"></div>
        </section>

        <!-- 控制台设置已迁至「系统设置」页（system-settings.html） -->

        <section id="plugin-settings-skills-panel" class="panel hidden">
          <div class="plugin-settings-content-head">
            <h2>Skills 设置</h2>
            <div class="setting-status">查看可选工具的用途，决定哪些工具可以被 AI 使用。</div>
            <div id="plugin-settings-skills-meta" class="plugin-settings-panel-meta"></div>
          </div>
          <div id="plugin-settings-skills-box" class="settings-grid">加载中...</div>
        </section>

        <!-- 导航设置已迁至「系统设置」页（system-settings.html） -->
      </div>
    </div>
  </div>
<script src="/auth.js"></script>
<script src="/plugin-settings-state.js"></script>
<script src="/plugin-settings-skills-data.js"></script>
<script src="/plugin-settings-skills.js"></script>
<script src="/plugin-settings-knowledge.js"></script>
<script src="/plugin-settings-recommendations.js"></script>
<script src="/plugin-settings-render.js"></script>
<script src="/plugin-settings-feature-render.js"></script>
<script src="/plugin-settings-skills-panel.js"></script>
<script src="/plugin-settings-skills-render.js"></script>
<script src="/plugin-settings-private-safety.js"></script>
<script src="/plugin-settings-persona-preset.js"></script>
<script src="/plugin-settings.js"></script>
<script src="/plugin-settings-events.js"></script>
  <script src="/theme.js"></script>
</body>
</html>
