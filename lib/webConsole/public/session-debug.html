<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>魔丸控制台 - 对话调试</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="page">
    <header class="hero">
      <div>
        <div class="hero-badge">魔丸控制台</div>
        <h1>对话调试</h1>
        <p id="session-debug-meta">正在加载...</p>
      </div>
      <div class="actions">
        <button id="copy-session-debug-json-btn">复制 JSON</button>
        <button id="toggle-session-debug-raw-btn">查看原始数据</button>
        <button id="reset-session-messages-debug-btn">仅清空消息</button>
        <button id="reset-session-debug-btn" class="danger">重置当前会话</button>
        <button id="theme-toggle-btn">深色主题</button>
        <a class="link-btn" href="/">返回首页</a>
      </div>
    </header>

    <section class="grid cards" id="session-debug-cards"></section>

    <section class="panel">
      <h2>关联操作</h2>
      <div id="session-debug-actions" class="actions">加载中...</div>
    </section>

    <section class="panel">
      <h2>调试筛选</h2>
      <div class="toolbar">
        <input id="session-debug-user-filter" placeholder="聚焦用户 ID" />
        <button id="session-debug-apply-filter-btn">应用筛选</button>
      </div>
      <div id="session-debug-alerts" class="list">加载中...</div>
    </section>

    <section class="panel panel-two">
      <div class="panel-inner">
        <h2>会话信息</h2>
        <div id="session-debug-main" class="kv-grid">加载中...</div>
      </div>
      <div class="panel-inner">
        <h2>调试摘要</h2>
        <div id="session-debug-summary" class="detail-box">加载中...</div>
        <div id="session-debug-runtime" class="detail-box session-debug-runtime-box">加载中...</div>
      </div>
    </section>

    <section class="panel panel-two">
      <div class="panel-inner">
        <h2>参与用户</h2>
        <div id="session-debug-participants" class="list">加载中...</div>
      </div>
      <div class="panel-inner">
        <h2>关联画像</h2>
        <div id="session-debug-profiles" class="list">加载中...</div>
      </div>
    </section>

    <section class="panel panel-two">
      <div class="panel-inner">
        <h2>最近话题</h2>
        <div id="session-debug-topics" class="list">加载中...</div>
      </div>
      <div class="panel-inner">
        <h2>表达习惯</h2>
        <div id="session-debug-expressions" class="list">加载中...</div>
      </div>
    </section>

    <section class="panel panel-two">
      <div class="panel-inner">
        <h2>知识命中详情</h2>
        <div class="toolbar session-debug-panel-toolbar">
          <input id="session-debug-knowledge-filter" placeholder="筛选知识命中" />
          <button id="session-debug-knowledge-export-btn">导出</button>
        </div>
        <div id="session-debug-knowledge" class="list">加载中...</div>
      </div>
      <div class="panel-inner">
        <h2>工具调用详情</h2>
        <div class="toolbar session-debug-panel-toolbar">
          <input id="session-debug-tool-filter" placeholder="筛选工具调用" />
          <button id="session-debug-tool-export-btn">导出</button>
        </div>
        <div id="session-debug-tool-calls" class="list">加载中...</div>
      </div>
    </section>

    <section class="panel">
      <h2>Prompt 摘要详情</h2>
      <div class="toolbar session-debug-panel-toolbar">
        <input id="session-debug-prompt-filter" placeholder="筛选 Prompt 摘要" />
        <button id="session-debug-prompt-export-btn">导出</button>
      </div>
      <div id="session-debug-prompt" class="list">加载中...</div>
    </section>

    <section class="panel">
      <h2>戳一戳调试</h2>
      <div class="toolbar session-debug-panel-toolbar">
        <button id="session-debug-poke-export-btn">导出</button>
      </div>
      <div id="session-debug-poke" class="list">加载中...</div>
    </section>

    <section class="panel">
      <h2>完整调试日志</h2>
      <div class="toolbar session-debug-panel-toolbar">
        <input id="session-debug-log-filter" placeholder="筛选完整日志" />
        <button id="session-debug-log-copy-btn">复制日志</button>
        <button id="session-debug-log-export-btn">导出</button>
      </div>
      <pre id="session-debug-log" class="detail-box session-debug-log-box">加载中...</pre>
    </section>

    <section class="panel panel-two">
      <div class="panel-inner">
        <h2>消息时间线</h2>
        <div id="session-debug-messages" class="list">加载中...</div>
      </div>
      <div class="panel-inner">
        <h2>关联 AI 请求</h2>
        <div id="session-debug-usage" class="list">加载中...</div>
      </div>
    </section>

    <section class="panel">
      <h2>好感历史摘要</h2>
      <div id="session-debug-affinity" class="detail-box">加载中...</div>
    </section>

    <section class="panel">
      <h2>原始数据</h2>
      <pre id="session-debug-raw" class="detail-box hidden">加载中...</pre>
    </section>
  </div>
  <script src="/session-debug.js"></script>
  <script src="/theme.js"></script>
</body>
</html>
