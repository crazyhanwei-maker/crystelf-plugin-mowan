<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>魔丸控制台 - 用户画像</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%233a6df0'/%3E%3Cpath d='M18 18h28v8H30v8h14v8H30v14H18Z' fill='white'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body data-collection-page="profiles">
  <div class="page">
    <header class="hero">
      <div class="hero-copy">
        <div class="hero-badge">魔丸控制台</div>
        <h1>用户画像中心</h1>
        <p id="page-meta">正在读取用户画像...</p>
      </div>
      <div class="hero-actions-shell">
        <div class="hero-action-group hero-token-group">
          <div class="hero-action-label">访问凭证</div>
          <div class="hero-token-row">
            <input id="auth-token" placeholder="控制台访问令牌，可留空" />
            <button id="save-token-btn">保存令牌</button>
          </div>
        </div>
        <div class="hero-action-group">
          <div class="hero-action-label">页面操作</div>
          <div class="actions hero-actions-grid">
            <button id="refresh-btn">刷新列表</button>
            <button id="clear-filters-btn">清空筛选</button>
            <a class="link-btn" href="/index.html">返回首页</a>
            <button id="theme-toggle-btn" data-theme-toggle>深色主题</button>
          </div>
        </div>
      </div>
    </header>

    <section class="panel panel-two">
      <div>
        <h2>列表状态</h2>
        <div id="refresh-status" class="setting-help">正在准备用户画像数据...</div>
      </div>
      <div>
        <h2>概览</h2>
        <div id="collection-summary" class="config-summary">加载中...</div>
      </div>
    </section>

    <section class="panel">
      <div class="section-head">
        <div>
          <h2>用户画像列表</h2>
          <div class="setting-help">支持按用户、会话、摘要和话题筛选，并保留详情与删除操作。</div>
        </div>
      </div>
      <div class="toolbar">
        <input id="collection-search" placeholder="搜索用户 / 概括 / 话题" />
        <input id="collection-filter-a" placeholder="按会话筛选，如 group:123" />
      </div>
      <div id="collection-list" class="list">加载中...</div>
      <div id="collection-pagination" class="pagination"></div>
    </section>
  </div>
  <script src="/collection-center.js"></script>
  <script src="/theme.js"></script>
</body>
</html>
