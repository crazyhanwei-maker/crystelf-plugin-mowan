<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>魔丸控制台 - 更新日志</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%233a6df0'/%3E%3Cpath d='M18 18h28v8H30v8h14v8H30v14H18Z' fill='white'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body class="update-log-page auth-guarded-page">
  <div class="page auth-guarded-content">
    <header class="hero">
      <div class="hero-copy">
        <div class="hero-badge">魔丸控制台</div>
        <h1>更新日志</h1>
      </div>
      <div class="actions">
        <button id="update-log-check-btn" type="button" class="link-btn update-log-btn-secondary">检查更新</button>
        <a class="link-btn" href="/index.html">返回总览</a>
      </div>
    </header>

    <section class="panel">
      <div class="section-head">
        <div>
          <h2>版本记录</h2>
          <div class="setting-help">按版本倒序展示，来源为插件仓库的 GIT.md 更新记录章节。</div>
        </div>
        <span id="update-log-update-badge" class="tag hidden"></span>
        <span id="update-log-version-tag" class="tag"></span>
      </div>
      <div id="update-log-update-status" class="update-log-update-status hidden"></div>
      <div id="update-log-timeline" class="update-log-timeline">加载中...</div>
    </section>
  </div>

  <script src="/auth.js"></script>
  <script src="/update-log.js"></script>
  <script src="/theme.js"></script>
</body>
</html>
